<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#287769" />
    <meta name="description" content="A simple, joyful way for nonverbal learners to practice selecting an option on a screen." />
    <link rel="icon" href="/favicon.ico" sizes="32x32 48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Picture Practice</title>
    %sveltekit.head%
  </head>
  <body>
    <div id="app">%sveltekit.body%</div>
    <!-- Cloudflare Web Analytics. PUBLIC_CF_BEACON_TOKEN is set only on the
         production Vercel environment, so local and preview builds don't count visits. -->
    <script>
      {
        const token = '%sveltekit.env.PUBLIC_CF_BEACON_TOKEN%';
        if (token) {
          const beacon = document.createElement('script');
          beacon.type = 'module';
          beacon.dataset.cfBeacon = JSON.stringify({ token });
          beacon.src = 'https://static.cloudflareinsights.com/beacon.min.js';
          document.body.append(beacon);
        }
      }
    </script>
  </body>
</html>
